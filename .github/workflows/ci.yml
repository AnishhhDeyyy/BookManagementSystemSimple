name: Book Management System CI

on:
  push: 
   branches: [develop,main]
  
  pull_request:
    branches: [develop,main]
  
permissions:
  contents: read

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:Anish@2002@localhost:5432/bookmanagement?schema=public"
      JWT_SECRET: Ansh@21551515$1525151515$45
      JWT_EXPIRES_IN: "15m"
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run : pnpm run db:generate

      - name: Build TypeScript
        run:  pnpm build 
        
      - name: Run tests
        run: pnpm test