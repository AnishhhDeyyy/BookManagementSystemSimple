name: Book Management System CI

on:
  push:
    branches: [develop, main]

  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookmanagement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookmanagement_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:Anish@2002@localhost:5432/bookmanagement?schema=public"
      JWT_SECRET: Ansh@21551515$1525151515$45
      JWT_EXPIRES_IN: "15m"
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Build TypeScript
        run: pnpm build

      - name: Run tests
        run: pnpm test